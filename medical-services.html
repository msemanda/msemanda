<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical Services — eHealth System</title>
<link rel="stylesheet" href="assets/css/admin.css">
<style>
.toggle-switch { position:relative; display:inline-block; width:38px; height:21px; }
.toggle-switch input { opacity:0; width:0; height:0; }
.toggle-slider { position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background:#CBD5E1; border-radius:21px; transition:.2s; }
.toggle-slider:before { position:absolute; content:""; height:15px; width:15px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.2s; }
input:checked + .toggle-slider { background:var(--teal); }
input:checked + .toggle-slider:before { transform:translateX(17px); }
.svc-icon { width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
.svc-name a { color:var(--teal); text-decoration:none; font-size:12px; }
.bulk-select { border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-family:inherit; font-size:12px; background:#F9FAFB; color:var(--ink); outline:none; cursor:pointer; }
</style>
</head>
<body>
<div class="shell">
  <nav id="sidebar-mount"></nav>
  <div class="main">
    <header class="header">
      <button class="btn-quick-links"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Quick Links</button>
      <div class="header-right">
        <button class="header-icon-btn"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/></svg></button>
        <button class="header-icon-btn"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></button>
        <span class="lang-badge">EN</span>
        <button class="header-icon-btn"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
        <button class="header-icon-btn"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/></svg></button>
        <div class="user-chip"><div class="user-avatar">M</div><div class="user-info"><div class="user-name">Moses Semanda</div><div class="user-role">Administrator</div></div></div>
      </div>
    </header>
    <div class="content">
      <div class="card">
        <div class="filter-bar">
          <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">All <span class="tab-count" id="svc-cnt-all"></span></button>
            <button class="filter-tab" data-filter="active">Active <span class="tab-count" id="svc-cnt-active"></span></button>
            <button class="filter-tab" data-filter="inactive">Deactive <span class="tab-count" id="svc-cnt-inactive"></span></button>
          </div>
          <div class="filter-right">
            <div class="search-input-wrap"><span class="si"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span><input type="text" placeholder="Search..."></div>
            <select class="per-page-select"><option>15</option><option>25</option></select>
            <select class="bulk-select"><option>Bulk actions</option><option>Activate</option><option>Deactivate</option><option>Delete</option></select>
            <button class="btn-apply">Apply</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th class="cb-col"><input type="checkbox" class="tbl-checkbox" id="sel-all"></th>
              <th>Title &#9650;</th>
              <th>Status &#9650;</th>
              <th>Created At &#9650;</th>
            </tr></thead>
            <tbody id="svc-tbody"></tbody>
            <tfoot><tr><td colspan="4" style="padding:12px 14px;font-size:12px;color:var(--muted);">Title &#9650;</td></tr></tfoot>
          </table>
        </div>
      </div>
    </div>
    <footer class="footer"><span>Copyright 2026 &copy; <a href="#">eHealth System</a></span><div class="version-badge"><span class="vbadge">v2.4.0</span><span class="lbadge">Load time: 0.7s</span></div></footer>
  </div>
</div>
<script src="assets/js/data.js"></script>
<script src="assets/js/auth.js"></script>
<script>
var ACTIVE_PAGE='medical-services';
var svcFilter='all';
function renderServices(){
  var all=EH.getServices();
  var filtered=all.filter(function(sv){
    if(svcFilter==='active') return sv.status==='active';
    if(svcFilter==='inactive') return sv.status!=='active';
    return true;
  });
  var ca=document.getElementById('svc-cnt-all'); if(ca) ca.textContent='('+all.length+')';
  var ci=document.getElementById('svc-cnt-active'); if(ci) ci.textContent='('+all.filter(function(sv){return sv.status==='active';}).length+')';
  var cd=document.getElementById('svc-cnt-inactive'); if(cd) cd.textContent='('+all.filter(function(sv){return sv.status!=='active';}).length+')';
  var tb=document.getElementById('svc-tbody');
  if(!filtered.length){tb.innerHTML='<tr><td colspan="4" style="text-align:center;padding:40px;color:var(--muted)">No services found.</td></tr>';return;}
  tb.innerHTML=filtered.map(function(sv){
    return '<tr>'
      +'<td><input type="checkbox" class="tbl-checkbox row-cb"></td>'
      +'<td><div class="user-chip-small"><div class="svc-icon" style="background:'+(sv.bg||'#E0F7FA')+'">'+sv.icon+'</div>'
      +'<div><div style="font-weight:600;font-size:13px;color:var(--ink)">'+sv.name+'</div></div></div></td>'
      +'<td><label class="toggle-switch"><input type="checkbox" '+(sv.status==='active'?'checked':'')
      +' onchange="toggleSvc(\''+sv.id+'\',this.checked)"><span class="toggle-slider"></span></label></td>'
      +'<td style="font-size:12px;color:var(--muted)">'+sv.createdAt+'</td>'
      +'</tr>';
  }).join('');
}
function toggleSvc(id,active){
  EH.updateService(id,{status:active?'active':'inactive'});
  renderServices();
  ehToast('Service '+(active?'activated':'deactivated')+'.','success');
}
document.querySelectorAll('.filter-tab[data-filter]').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.filter-tab').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active'); svcFilter=btn.dataset.filter; renderServices();
  });
});
document.addEventListener('DOMContentLoaded',function(){ EHAuth.init(); renderServices(); });
</script>
<script src="assets/js/sidebar.js"></script>
</body>
</html>
