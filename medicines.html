<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medicines — eHealth System</title>
<link rel="stylesheet" href="assets/css/admin.css">
<style>
.med-tabs { display:flex; gap:0; border-bottom:2px solid var(--border); margin-bottom:24px; }
.med-tab { background:none; border:none; padding:10px 20px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; transition:color .15s,border-color .15s; }
.med-tab.active { color:var(--teal); border-bottom-color:var(--teal); }
.med-tab-panel { display:none; }
.med-tab-panel.active { display:block; }

/* Form layout */
.form-row { display:grid; grid-template-columns:160px 1fr; align-items:flex-start; gap:16px 24px; margin-bottom:20px; }
.form-row label { font-size:13px; font-weight:600; color:var(--dark,#2d3748); padding-top:9px; }
.form-row label span { color:var(--danger,#e53e3e); }
.form-row input[type=text], .form-row textarea, .form-row select { width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:8px; font-size:13px; font-family:inherit; box-sizing:border-box; }
.form-row textarea { resize:vertical; min-height:90px; }
.form-row input:focus, .form-row textarea:focus, .form-row select:focus { outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(13,167,167,.12); }
.form-actions { display:flex; justify-content:flex-end; padding-top:8px; gap:8px; }

/* Table */
.med-actions { display:flex; gap:10px; font-size:12px; margin-top:3px; }
.med-actions a { color:var(--teal); text-decoration:none; font-weight:500; }
.med-actions a.trash { color:var(--danger,#e53e3e); }
.med-actions a.restore { color:var(--success,#38a169); }
.med-actions a:hover { text-decoration:underline; }
.bulk-bar { display:flex; align-items:center; gap:8px; }
.bulk-select { padding:6px 10px; border:1px solid var(--border); border-radius:8px; font-size:12px; font-family:inherit; }
.trash-row td { opacity:.55; }
.desc-cell { font-size:12px; color:var(--muted); max-width:400px; }
</style>
</head>
<body>
<div class="shell">
  <nav id="sidebar-mount"></nav>
  <div class="main">
    <header class="header">
      <button class="btn-quick-links"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Quick Links</button>
      <div class="header-right">
        <button class="header-icon-btn"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/></svg></button>
        <span class="lang-badge">EN</span>
        <button class="header-icon-btn"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/></svg></button>
        <div class="user-chip"><div class="user-avatar">M</div><div class="user-info"><div class="user-name">Moses Semanda</div><div class="user-role">Administrator</div></div></div>
      </div>
    </header>
    <div class="content">
      <div class="page-title-row">
        <h1 class="page-title">Medicines</h1>
        <button class="btn btn-teal" onclick="switchTab('add')"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" width="14" height="14"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add Medicine</button>
      </div>

      <!-- Tabs -->
      <div class="med-tabs">
        <button class="med-tab active" data-tab="list" onclick="switchTab('list')">All Medicines</button>
        <button class="med-tab" data-tab="add" onclick="switchTab('add')" id="add-tab-btn">Add Medicine</button>
      </div>

      <!-- List Panel -->
      <div class="med-tab-panel active" id="panel-list">
        <div class="card">
          <div class="filter-bar">
            <div class="filter-tabs">
              <button class="filter-tab active" data-filter="all" onclick="setFilter(this,'all')">All <span class="tab-count" id="cnt-all"></span></button>
              <button class="filter-tab" data-filter="trash" onclick="setFilter(this,'trash')">Trash <span class="tab-count" id="cnt-trash"></span></button>
            </div>
            <div class="filter-right">
              <div class="search-input-wrap"><span class="si"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span><input type="text" id="med-search" placeholder="Search..." oninput="renderMeds()"></div>
              <select class="per-page-select" id="per-page"><option>15</option><option>25</option><option>50</option></select>
              <div class="bulk-bar">
                <select class="bulk-select" id="bulk-action">
                  <option value="">Bulk actions</option>
                  <option value="trash">Move to Trash</option>
                  <option value="restore">Restore</option>
                  <option value="delete">Delete Permanently</option>
                </select>
                <button class="btn-apply" onclick="applyBulk()">Apply</button>
              </div>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr>
                <th class="cb-col"><input type="checkbox" class="tbl-checkbox" id="sel-all" onchange="toggleAll(this)"></th>
                <th>Name</th>
                <th>Description</th>
                <th>Created At</th>
              </tr></thead>
              <tbody id="med-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Add/Edit Panel -->
      <div class="med-tab-panel" id="panel-add">
        <div class="card" style="max-width:680px;">
          <h3 id="form-title" style="margin:0 0 24px;font-size:15px;font-weight:700;">Add Medicine <span style="font-size:12px;color:var(--muted);font-weight:400;">(en)</span></h3>
          <input type="hidden" id="edit-id">

          <div class="form-row">
            <label>Name <span>*</span></label>
            <input type="text" id="med-name" placeholder="Enter Name (en)">
          </div>

          <div class="form-row">
            <label>Description</label>
            <textarea id="med-desc" placeholder="Enter Description (en)"></textarea>
          </div>

          <div class="form-actions">
            <button class="btn btn-secondary" onclick="cancelForm()">Cancel</button>
            <button class="btn btn-teal" onclick="saveMed()">Save</button>
          </div>
        </div>
      </div>
    </div>
    <footer class="footer"><span>Copyright 2026 &copy; <a href="#">eHealth System</a></span><div class="version-badge"><span class="vbadge">v2.4.0</span><span class="lbadge">Load time: 0.3s</span></div></footer>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/sidebar.js"></script>
<script>
var ACTIVE_PAGE = 'medicines';
var medFilter = 'all';

function switchTab(tab) {
  document.querySelectorAll('.med-tab').forEach(function(t){ t.classList.remove('active'); });
  document.querySelectorAll('.med-tab-panel').forEach(function(p){ p.classList.remove('active'); });
  document.querySelector('[data-tab="'+tab+'"]').classList.add('active');
  document.getElementById('panel-'+tab).classList.add('active');
  if (tab === 'add' && !document.getElementById('edit-id').value) resetForm();
}

function cancelForm() {
  resetForm();
  switchTab('list');
}

function resetForm() {
  document.getElementById('edit-id').value = '';
  document.getElementById('med-name').value = '';
  document.getElementById('med-desc').value = '';
  document.getElementById('form-title').innerHTML = 'Add Medicine <span style="font-size:12px;color:var(--muted);font-weight:400;">(en)</span>';
  document.getElementById('add-tab-btn').textContent = 'Add Medicine';
}

function setFilter(btn, f) {
  document.querySelectorAll('.filter-tab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  medFilter = f;
  renderMeds();
}

function toggleAll(cb) {
  document.querySelectorAll('.row-cb').forEach(function(c){ c.checked = cb.checked; });
}

function getSelected() {
  var ids = [];
  document.querySelectorAll('.row-cb:checked').forEach(function(c){ ids.push(c.dataset.id); });
  return ids;
}

function applyBulk() {
  var action = document.getElementById('bulk-action').value;
  var ids = getSelected();
  if (!action) { ehToast('Select a bulk action.', 'error'); return; }
  if (!ids.length) { ehToast('Select at least one row.', 'error'); return; }
  ids.forEach(function(id) {
    if (action === 'trash')   EH.updateMedicine(id, { status:'trash' });
    if (action === 'restore') EH.updateMedicine(id, { status:'active' });
    if (action === 'delete')  EH.deleteMedicine(id);
  });
  document.getElementById('sel-all').checked = false;
  document.getElementById('bulk-action').value = '';
  renderMeds();
  ehToast('Bulk action applied.', 'success');
}

function editMed(id) {
  var m = EH.getMedicines().find(function(x){ return x.id === id; });
  if (!m) return;
  document.getElementById('edit-id').value = m.id;
  document.getElementById('med-name').value = m.name;
  document.getElementById('med-desc').value = m.description || '';
  document.getElementById('form-title').innerHTML = 'Edit Medicine <span style="font-size:12px;color:var(--muted);font-weight:400;">(en)</span>';
  document.getElementById('add-tab-btn').textContent = 'Edit Medicine';
  switchTab('add');
}

function trashMed(id) {
  EH.updateMedicine(id, { status:'trash' });
  renderMeds();
  ehToast('Moved to trash.', 'success');
}

function restoreMed(id) {
  EH.updateMedicine(id, { status:'active' });
  renderMeds();
  ehToast('Medicine restored.', 'success');
}

function permDeleteMed(id) {
  if (!confirm('Permanently delete this medicine? This cannot be undone.')) return;
  EH.deleteMedicine(id);
  renderMeds();
  ehToast('Medicine deleted.', 'success');
}

function saveMed() {
  var name = document.getElementById('med-name').value.trim();
  var desc = document.getElementById('med-desc').value.trim();
  var eid = document.getElementById('edit-id').value;
  if (!name) { ehToast('Medicine name is required.', 'error'); return; }
  if (eid) {
    EH.updateMedicine(eid, { name:name, description:desc });
    ehToast('"'+name+'" updated.', 'success');
  } else {
    EH.addMedicine({ name:name, description:desc });
    ehToast('"'+name+'" added.', 'success');
  }
  cancelForm();
  renderMeds();
}

function renderMeds() {
  var all = EH.getMedicines();
  var q = (document.getElementById('med-search')||{}).value || '';
  q = q.toLowerCase();
  var perPage = parseInt((document.getElementById('per-page')||{}).value || 15);

  var active = all.filter(function(m){ return m.status !== 'trash'; });
  var trash  = all.filter(function(m){ return m.status === 'trash'; });

  var el = document.getElementById('cnt-all');   if(el) el.textContent='('+active.length+')';
  el = document.getElementById('cnt-trash'); if(el) el.textContent='('+trash.length+')';

  var filtered = medFilter === 'trash' ? trash : active;
  if (q) filtered = filtered.filter(function(m){ return (m.name||'').toLowerCase().indexOf(q) > -1 || (m.description||'').toLowerCase().indexOf(q) > -1; });
  filtered = filtered.slice(0, perPage);

  var tb = document.getElementById('med-tbody');
  if (!filtered.length) {
    tb.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:40px;color:var(--muted)">No medicines found.</td></tr>';
    return;
  }

  tb.innerHTML = filtered.map(function(m) {
    var isTrash = m.status === 'trash';
    var actions = isTrash
      ? '<div class="med-actions"><a href="#" class="restore" onclick="restoreMed(\''+m.id+'\');return false">Restore</a> | <a href="#" class="trash" onclick="permDeleteMed(\''+m.id+'\');return false">Delete</a></div>'
      : '<div class="med-actions"><a href="#" onclick="editMed(\''+m.id+'\');return false">Edit</a> | <a href="#" class="trash" onclick="trashMed(\''+m.id+'\');return false">Move To Trash</a></div>';

    return '<tr class="'+(isTrash?'trash-row':'')+'">'
      + '<td><input type="checkbox" class="tbl-checkbox row-cb" data-id="'+m.id+'"></td>'
      + '<td><div style="font-size:13px;font-weight:600;color:var(--dark,#2d3748)">'+m.name+'</div>' + actions + '</td>'
      + '<td class="desc-cell">'+(m.description||'—')+'</td>'
      + '<td style="font-size:12px;color:var(--muted);white-space:nowrap">'+(m.createdAt||'—')+'</td>'
      + '</tr>';
  }).join('');
}

document.addEventListener('DOMContentLoaded', function() {
  EHAuth.init();
  renderMeds();
});
</script>
</body>
</html>
