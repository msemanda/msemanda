<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Consultations — eHealth System</title>
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
<div class="shell">
  <nav id="sidebar-mount"></nav>
  <div class="main">
    <header class="header">
      <button class="btn-quick-links"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Quick Links</button>
      <div class="header-right">
        <button class="header-icon-btn"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/></svg></button>
        <span class="lang-badge">EN</span>
        <button class="header-icon-btn"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/></svg></button>
        <div class="user-chip"><div class="user-avatar">M</div><div class="user-info"><div class="user-name">Moses Semanda</div><div class="user-role">Administrator</div></div></div>
      </div>
    </header>
    <div class="content">
      <div class="page-title-row"><h1 class="page-title">Video Consultations</h1></div>
      <div class="card">
        <div class="filter-bar">
          <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">All <span class="tab-count" id="vc-cnt-all"></span></button>
            <button class="filter-tab" data-filter="pending">Pending <span class="tab-count" id="vc-cnt-pending"></span></button>
            <button class="filter-tab" data-filter="completed">Completed <span class="tab-count" id="vc-cnt-completed"></span></button>
          </div>
          <div class="filter-right">
            <div class="search-input-wrap"><span class="si"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span><input type="text" placeholder="Search..."></div>
            <select class="per-page-select"><option>15</option><option>25</option></select>
            <button class="btn-apply">Apply</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th class="cb-col"><input type="checkbox" class="tbl-checkbox" id="sel-all"></th>
              <th>Patient &#9650;</th>
              <th>Doctor &#9650;</th>
              <th>Date &#9650;</th>
              <th>Time &#9650;</th>
              <th>Hospital &#9650;</th>
              <th>Status &#9650;</th>
            </tr></thead>
            <tbody id="vc-tbody"></tbody>
            <tfoot><tr><td colspan="7" style="padding:12px 14px;font-size:12px;color:var(--muted);">Patient &#9650;</td></tr></tfoot>
          </table>
        </div>
      </div>
    </div>
    <footer class="footer"><span>Copyright 2026 &copy; <a href="#">eHealth System</a></span><div class="version-badge"><span class="vbadge">v2.4.0</span><span class="lbadge">Load time: 0.5s</span></div></footer>
  </div>
</div>
<script src="assets/js/data.js"></script>
<script src="assets/js/auth.js"></script>
<script>
var ACTIVE_PAGE='video-consultations';
var vcTenantId=null, vcFilter='all';
var VC_BADGES={
  pending:'<span class="badge badge-pending">Pending</span>',
  confirmed:'<span class="badge badge-confirmed">Confirmed</span>',
  completed:'<span class="badge badge-completed">Completed</span>',
  visited:'<span class="badge badge-visited">Visited</span>',
  rescheduled:'<span class="badge badge-rescheduled">Rescheduled</span>',
  cancelled:'<span class="badge" style="background:#FEE2E2;color:#DC2626">Cancelled</span>'
};
function renderVC(){
  var all=EH.getAppointments(vcTenantId).filter(function(a){return a.type==='Virtual';});
  var filtered=all.filter(function(a){
    if(vcFilter==='pending') return a.status==='pending';
    if(vcFilter==='completed') return a.status==='completed'||a.status==='visited';
    return true;
  });
  var ca=document.getElementById('vc-cnt-all'); if(ca) ca.textContent='('+all.length+')';
  var cp=document.getElementById('vc-cnt-pending'); if(cp) cp.textContent='('+all.filter(function(a){return a.status==='pending';}).length+')';
  var cc=document.getElementById('vc-cnt-completed'); if(cc) cc.textContent='('+all.filter(function(a){return a.status==='completed'||a.status==='visited';}).length+')';
  var tb=document.getElementById('vc-tbody');
  if(!filtered.length){tb.innerHTML='<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--muted)">No video consultations found.</td></tr>';return;}
  tb.innerHTML=filtered.map(function(a){
    return '<tr>'
      +'<td><input type="checkbox" class="tbl-checkbox row-cb"></td>'
      +'<td><div class="user-chip-small"><div style="width:28px;height:28px;border-radius:7px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0">'+a.patient.charAt(0)+'</div><div><div style="font-weight:600;font-size:13px">'+a.patient+'</div><div style="font-size:11px;color:var(--muted)">'+a.patientEmail+'</div></div></div></td>'
      +'<td style="font-size:12px">'+a.doctor+'</td>'
      +'<td style="font-size:12px;color:var(--muted)">'+a.date+'</td>'
      +'<td style="font-size:12px">'+a.time+'</td>'
      +'<td style="font-size:12px;color:var(--muted)">'+a.hospital+'</td>'
      +'<td>'+(VC_BADGES[a.status]||'<span class="badge">'+a.status+'</span>')+'</td>'
      +'</tr>';
  }).join('');
}
document.querySelectorAll('.filter-tab[data-filter]').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.filter-tab').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active'); vcFilter=btn.dataset.filter; renderVC();
  });
});
document.addEventListener('DOMContentLoaded',function(){
  var s=EHAuth.init(); if(!s) return;
  vcTenantId=window.EH_TENANT||null;
  renderVC();
});
window.addEventListener('eh:tenantchange',function(e){ vcTenantId=e.detail.tenantId; renderVC(); });
</script>
<script src="assets/js/sidebar.js"></script>
</body>
</html>
