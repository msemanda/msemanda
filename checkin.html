<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkin — eHealth System</title>
<link rel="stylesheet" href="assets/css/admin.css">
<style>
.filter-select { border:1px solid var(--border); border-radius:6px; padding:7px 12px; font-family:inherit; font-size:12.5px; color:var(--ink); background:#F9FAFB; outline:none; cursor:pointer; min-width:130px; }
.empty-table { text-align:center; padding:80px 20px; color:var(--muted); }
.empty-table svg { display:block; margin:0 auto 14px; opacity:.25; }
</style>
</head>
<body>
<div class="shell">
  <nav id="sidebar-mount"></nav>
  <div class="main">
    <header class="header">
      <button class="btn-quick-links"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Quick Links</button>
      <div class="header-right">
        <button class="header-icon-btn"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/></svg></button>
        <span class="lang-badge">EN</span>
        <button class="header-icon-btn"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/></svg></button>
        <div class="user-chip"><div class="user-avatar">M</div><div class="user-info"><div class="user-name">Moses Semanda</div><div class="user-role">Administrator</div></div></div>
      </div>
    </header>
    <div class="content">
      <div class="page-title-row">
        <h1 class="page-title">Checkin</h1>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <select class="filter-select"><option>All Hospitals</option><option>Sunrise Care Hospital</option><option>MapleCare Medical</option><option>BlueCross General</option></select>
          <select class="filter-select"><option>All Doctors</option><option>Dr. Ethan Walker</option><option>Dr. Sophia Reed</option><option>Dr. Ava Richardson</option></select>
          <button class="btn btn-teal"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>New Checkin</button>
        </div>
      </div>
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Patient Name &#9650;</th>
              <th>Time slot &#9650;</th>
              <th>Department &#9650;</th>
              <th>Doctor &#9650;</th>
              <th>Hospital &#9650;</th>
              <th>Status &#9650;</th>
              <th>Action</th>
            </tr></thead>
            <tbody>
              <tr>
                <td colspan="7">
                  <div class="empty-table">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    <p>No check-ins found for today.</p>
                    <p style="font-size:12px;margin-top:4px">Use "New Checkin" to register a patient check-in.</p>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <footer class="footer"><span>Copyright 2026 &copy; <a href="#">eHealth System</a></span><div class="version-badge"><span class="vbadge">v2.4.0</span><span class="lbadge">Load time: 9.64s</span></div></footer>
  </div>
</div>
<script src="assets/js/data.js"></script>
<script src="assets/js/auth.js"></script>
<script>var ACTIVE_PAGE='checkin';</script>
<script src="assets/js/sidebar.js"></script>
<script>document.addEventListener('DOMContentLoaded', function(){ EHAuth.init(); });</script>
</body>
</html>
