<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appointments — eHealth System</title>
<link rel="stylesheet" href="assets/css/admin.css">
<style>
.tenant-bar { background:linear-gradient(135deg,var(--teal),#066060); color:#fff; border-radius:10px; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; font-size:13px; font-weight:700; }
.tenant-bar span { opacity:.75; font-size:11px; font-weight:600; }
</style>
</head>
<body>
<div class="shell">
  <nav id="sidebar-mount"></nav>
  <div class="main">
    <header class="header">
      <button class="btn-quick-links"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Quick Links</button>
      <div class="header-right">
        <button class="header-icon-btn"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/></svg></button>
        <span class="lang-badge">EN</span>
        <button class="header-icon-btn"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/></svg></button>
        <div class="user-chip"><div class="user-avatar">M</div><div class="user-info"><div class="user-name">Moses Semanda</div><div class="user-role">Administrator</div></div></div>
      </div>
    </header>
    <div class="content">
      <div class="page-title-row">
        <h1 class="page-title">All Appointments</h1>
        <a href="add-appointment.html" class="btn btn-teal"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" width="14" height="14"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add Appointment</a>
      </div>

      <div id="tenant-bar" style="display:none" class="tenant-bar">
        <div><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="vertical-align:middle;margin-right:6px"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg><span id="tenant-bar-name"></span></div>
        <span>Showing appointments for this hospital only</span>
      </div>

      <div class="card">
        <div class="filter-bar">
          <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">All <span class="tab-count" id="cnt-all"></span></button>
            <button class="filter-tab" data-filter="pending">Pending <span class="tab-count" id="cnt-pending"></span></button>
            <button class="filter-tab" data-filter="confirmed">Confirmed <span class="tab-count" id="cnt-confirmed"></span></button>
            <button class="filter-tab" data-filter="completed">Completed <span class="tab-count" id="cnt-completed"></span></button>
            <button class="filter-tab" data-filter="rejected">Rejected <span class="tab-count" id="cnt-rejected"></span></button>
            <button class="filter-tab" data-filter="visited">Visited <span class="tab-count" id="cnt-visited"></span></button>
            <button class="filter-tab" data-filter="rescheduled">Rescheduled <span class="tab-count" id="cnt-rescheduled"></span></button>
            <button class="filter-tab" data-filter="cancelled">Cancelled <span class="tab-count" id="cnt-cancelled"></span></button>
          </div>
          <div class="filter-right">
            <div class="search-input-wrap"><span class="si"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span><input type="text" id="appt-search" placeholder="Search..." oninput="renderAppts()"></div>
            <select class="per-page-select"><option>15</option><option>25</option><option>50</option></select>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th class="cb-col"><input type="checkbox" class="tbl-checkbox" id="sel-all" onchange="document.querySelectorAll('.row-cb').forEach(function(c){c.checked=this.checked;}.bind(this))"></th>
              <th>Number ▲</th>
              <th>Patient ▲</th>
              <th>Doctor ▲</th>
              <th>Hospital ▲</th>
              <th>Type ▲</th>
              <th>Date ▲</th>
              <th>Time ▲</th>
              <th>Status ▲</th>
              <th>Action</th>
            </tr></thead>
            <tbody id="appts-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
    <footer class="footer"><span>Copyright 2026 &copy; <a href="#">eHealth System</a></span><div class="version-badge"><span class="vbadge">v2.4.0</span><span class="lbadge">Load time: 0.3s</span></div></footer>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/auth.js"></script>
<script>
var ACTIVE_PAGE   = 'appointments';
var currentFilter = 'all';
var tenantId      = null;

var STATUS_BADGES = {
  pending:     '<span class="badge badge-pending">Pending</span>',
  confirmed:   '<span class="badge badge-confirmed">Confirmed</span>',
  completed:   '<span class="badge badge-completed">Completed</span>',
  rejected:    '<span class="badge badge-rejected">Rejected</span>',
  visited:     '<span class="badge badge-visited">Visited</span>',
  rescheduled: '<span class="badge badge-rescheduled">Rescheduled</span>',
  cancelled:   '<span class="badge" style="background:#FEE2E2;color:#DC2626">Cancelled</span>'
};
var MINI_COLORS = ['#0DA7A7','#7C3AED','#059669','#DB2777','#D97706','#2563EB','#DC2626'];
function mc(n) { return MINI_COLORS[(n||'A').charCodeAt(0)%MINI_COLORS.length]; }

function renderAppts() {
  var appts = EH.getAppointments(tenantId);
  var q = (document.getElementById('appt-search').value||'').toLowerCase();
  var filtered = appts.filter(function(a) {
    if (currentFilter !== 'all' && a.status !== currentFilter) return false;
    if (q && a.patient.toLowerCase().indexOf(q)<0 && a.doctor.toLowerCase().indexOf(q)<0 && a.num.toLowerCase().indexOf(q)<0) return false;
    return true;
  });

  // Update counts
  ['all','pending','confirmed','completed','rejected','visited','rescheduled','cancelled'].forEach(function(s) {
    var el = document.getElementById('cnt-'+s);
    if (el) el.textContent = '(' + (s==='all' ? appts.length : appts.filter(function(a){return a.status===s;}).length) + ')';
  });

  var tbody = document.getElementById('appts-tbody');
  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:40px;color:var(--muted)">No appointments found.</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(function(a) {
    var pColor = mc(a.patient);
    var dColor = mc(a.doctor);
    var tenant = a.tenantId ? EH.getTenant(a.tenantId) : null;
    var hospName = tenant ? tenant.name : (a.hospital||'—');
    return '<tr>'
      + '<td><input type="checkbox" class="tbl-checkbox row-cb"></td>'
      + '<td><span class="num-pill">'+a.num+'</span></td>'
      + '<td><div class="user-chip-small"><div class="mini-avatar" style="background:'+pColor+';color:#fff">'+a.patient.charAt(0)+'</div><div><div class="uc-name">'+a.patient+'</div><div class="uc-email">'+a.patientEmail+'</div></div></div></td>'
      + '<td><div class="user-chip-small"><div class="mini-avatar" style="background:'+dColor+';color:#fff">'+a.doctor.charAt(0)+'</div><div class="uc-name">'+a.doctor+'</div></div></td>'
      + '<td style="font-size:11.5px;color:var(--muted)">'+hospName+'</td>'
      + '<td style="font-size:12px">'+a.type+'</td>'
      + '<td style="font-size:12px">'+a.date+'</td>'
      + '<td style="font-size:12px">'+a.time+'</td>'
      + '<td>'+(STATUS_BADGES[a.status]||'<span class="badge">'+a.status+'</span>')+'</td>'
      + '<td><div style="display:flex;gap:4px">'
      + '<select class="per-page-select" style="font-size:11px;padding:4px 6px" onchange="changeStatus(\''+a.id+'\',this.value)">'
      + ['pending','confirmed','completed','visited','rescheduled','rejected','cancelled'].map(function(s){ return '<option value="'+s+'"'+(a.status===s?' selected':'')+'>'+s.charAt(0).toUpperCase()+s.slice(1)+'</option>'; }).join('')
      + '</select></div></td>'
      + '</tr>';
  }).join('');
}

function changeStatus(id, status) {
  EH.updateAppointmentStatus(id, status);
  renderAppts();
  ehToast('Status updated to ' + status, 'success');
}

document.querySelectorAll('.filter-tab[data-filter]').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-tab').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderAppts();
  });
});

document.addEventListener('DOMContentLoaded', function() {
  EHAuth.init();
  tenantId = window.EH_TENANT || null;
  if (tenantId) {
    var t = EH.getTenant(tenantId);
    var bar = document.getElementById('tenant-bar');
    bar.style.display = 'flex';
    document.getElementById('tenant-bar-name').textContent = t ? t.name : tenantId;
  }
  renderAppts();
});
window.addEventListener('eh:tenantchange', function(e) { tenantId = e.detail.tenantId; renderAppts(); });
</script>
<script>var ACTIVE_PAGE='appointments';</script>
<script src="assets/js/sidebar.js"></script>
</body>
</html>
