<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile — eHealth System</title>
<link rel="stylesheet" href="assets/css/admin.css">
<style>
.profile-card { max-width:780px; background:#fff; border:1px solid var(--border); border-radius:12px; overflow:hidden; }
.profile-tabs { display:flex; border-bottom:1px solid var(--border); background:#F9FAFB; }
.profile-tab { display:flex; align-items:center; gap:7px; padding:14px 22px; font-size:13px; font-weight:600; color:var(--muted); background:none; border:none; border-bottom:2px solid transparent; cursor:pointer; font-family:inherit; transition:color .15s; }
.profile-tab.active { color:var(--teal); background:#fff; border-bottom-color:var(--teal); }
.profile-tab svg { width:15px; height:15px; flex-shrink:0; }
.profile-body { padding:32px 36px; }
.profile-row { display:grid; grid-template-columns:160px 1fr; align-items:flex-start; gap:24px; margin-bottom:24px; }
.profile-row-label { font-size:13px; font-weight:600; color:var(--ink); padding-top:10px; }
.profile-row-label .req { color:var(--danger); margin-left:2px; }
.avatar-box { width:80px; height:80px; border:2px dashed var(--border); border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; overflow:hidden; background:#F9FAFB; }
.avatar-box:hover { border-color:var(--teal); background:var(--teal-light); }
.avatar-box input { position:absolute; inset:0; opacity:0; cursor:pointer; }
.avatar-box svg { width:22px; height:22px; color:var(--muted); }
.avatar-box img { width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
.avatar-hint { font-size:11.5px; color:var(--teal); margin-top:8px; }
.profile-footer { display:flex; justify-content:flex-end; padding:20px 36px; border-top:1px solid var(--border); background:#F9FAFB; }
.pane { display:none; }
.pane.active { display:block; }
</style>
</head>
<body>
<div class="shell">
  <nav id="sidebar-mount"></nav>
  <div class="main">
    <header class="header">
      <button class="btn-quick-links"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Quick Links</button>
      <div class="header-right">
        <button class="header-icon-btn"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/></svg></button>
        <span class="lang-badge">EN</span>
        <button class="header-icon-btn"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/></svg></button>
        <div class="user-chip"><div class="user-avatar">M</div><div class="user-info"><div class="user-name">Moses Semanda</div><div class="user-role">Administrator</div></div></div>
      </div>
    </header>
    <div class="content">
      <div class="page-title-row"><h1 class="page-title">Edit Profile</h1></div>
      <div class="profile-card">
        <div class="profile-tabs">
          <button class="profile-tab active" data-pane="pane-general">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>General
          </button>
          <button class="profile-tab" data-pane="pane-password">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>Change Password
          </button>
        </div>

        <!-- General tab -->
        <div class="pane active" id="pane-general">
          <div class="profile-body">
            <div class="profile-row">
              <div class="profile-row-label">Avatar</div>
              <div>
                <div class="avatar-box" id="avatar-box">
                  <input type="file" accept="image/*" id="avatar-input">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" id="avatar-plus"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  <img id="avatar-preview" src="" alt="" style="display:none">
                </div>
                <div class="avatar-hint">*Upload image size 100x100px recommended</div>
              </div>
            </div>
            <div class="profile-row">
              <div class="profile-row-label">Full Name<span class="req">*</span></div>
              <input type="text" class="form-control" id="prof-name" placeholder="Full Name">
            </div>
            <div class="profile-row">
              <div class="profile-row-label">Email<span class="req">*</span></div>
              <input type="email" class="form-control" id="prof-email" placeholder="Email address">
            </div>
            <div class="profile-row">
              <div class="profile-row-label">Phone<span class="req">*</span></div>
              <div class="phone-row">
                <select class="form-control" id="prof-phone-code">
                  <option value="+256">+256</option>
                  <option value="+1">+1</option>
                  <option value="+44">+44</option>
                  <option value="+91">+91</option>
                  <option value="+254">+254</option>
                  <option value="+255">+255</option>
                  <option value="+250">+250</option>
                  <option value="+234">+234</option>
                  <option value="+27">+27</option>
                </select>
                <input type="tel" class="form-control" id="prof-phone" placeholder="Enter Phone">
              </div>
            </div>
          </div>
          <div class="profile-footer">
            <button class="btn btn-teal" onclick="saveGeneral()">Save</button>
          </div>
        </div>

        <!-- Change Password tab -->
        <div class="pane" id="pane-password">
          <div class="profile-body">
            <div class="profile-row">
              <div class="profile-row-label">Current Password<span class="req">*</span></div>
              <input type="password" class="form-control" id="prof-cur-pwd" placeholder="Current password">
            </div>
            <div class="profile-row">
              <div class="profile-row-label">New Password<span class="req">*</span></div>
              <input type="password" class="form-control" id="prof-new-pwd" placeholder="New password">
            </div>
            <div class="profile-row">
              <div class="profile-row-label">Confirm Password<span class="req">*</span></div>
              <input type="password" class="form-control" id="prof-confirm-pwd" placeholder="Confirm new password">
            </div>
          </div>
          <div class="profile-footer">
            <button class="btn btn-teal" onclick="savePassword()">Update Password</button>
          </div>
        </div>
      </div>
    </div>
    <footer class="footer"><span>Copyright 2026 &copy; <a href="#">eHealth System</a></span><div class="version-badge"><span class="vbadge">v2.4.0</span><span class="lbadge">Load time: 0.3s</span></div></footer>
  </div>
</div>
<script src="assets/js/data-api.js"></script>
<script src="assets/js/auth.js"></script>
<script>
var ACTIVE_PAGE='edit-profile';

/* Tab switching */
document.querySelectorAll('.profile-tab').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.profile-tab').forEach(function(b){b.classList.remove('active');});
    document.querySelectorAll('.pane').forEach(function(p){p.classList.remove('active');});
    btn.classList.add('active');
    document.getElementById(btn.dataset.pane).classList.add('active');
  });
});

/* Avatar preview */
document.getElementById('avatar-input').addEventListener('change',function(){
  var file=this.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=document.getElementById('avatar-preview');
    img.src=e.target.result; img.style.display='';
    document.getElementById('avatar-plus').style.display='none';
  };
  reader.readAsDataURL(file);
});

/* Load current session into form */
document.addEventListener('eh:ready',function(){
  var s=EHAuth.init(); if(!s) return;
  document.getElementById('prof-name').value=s.name||'';
  document.getElementById('prof-email').value=s.email||'';
  if(s.phone){
    var parts=(s.phone||'').split(' ');
    if(parts.length>1){
      document.getElementById('prof-phone-code').value=parts[0];
      document.getElementById('prof-phone').value=parts.slice(1).join(' ');
    } else {
      document.getElementById('prof-phone').value=s.phone;
    }
  }
});

function saveGeneral(){
  var name=document.getElementById('prof-name').value.trim();
  var email=document.getElementById('prof-email').value.trim();
  var code=document.getElementById('prof-phone-code').value;
  var phone=document.getElementById('prof-phone').value.trim();
  if(!name||!email){ ehToast('Name and email are required.','error'); return; }
  var s=EHAuth.getSession(); if(!s) return;
  var updates={name:name, email:email, avatar:name.charAt(0).toUpperCase()};
  if(phone) updates.phone=code+' '+phone;
  EH.updateUser(s.id, updates);
  /* Update live session */
  Object.assign(s, updates);
  try{ sessionStorage.setItem('eh_session', JSON.stringify(s)); }catch(e){}
  /* Refresh header */
  var avatarEl=document.querySelector('.user-avatar');
  var nameEl=document.querySelector('.user-name');
  if(avatarEl) avatarEl.textContent=updates.avatar;
  if(nameEl) nameEl.textContent=name;
  ehToast('Profile updated successfully.','success');
}

function savePassword(){
  var cur=document.getElementById('prof-cur-pwd').value;
  var nw=document.getElementById('prof-new-pwd').value;
  var conf=document.getElementById('prof-confirm-pwd').value;
  if(!cur||!nw||!conf){ ehToast('All password fields are required.','error'); return; }
  if(nw!==conf){ ehToast('New passwords do not match.','error'); return; }
  if(nw.length<6){ ehToast('Password must be at least 6 characters.','error'); return; }
  var s=EHAuth.getSession(); if(!s) return;
  var users=EH.getUsers(null);
  var user=users.find(function(u){return u.id===s.id;});
  if(!user||user.password!==cur){ ehToast('Current password is incorrect.','error'); return; }
  EH.updateUser(s.id,{password:nw});
  document.getElementById('prof-cur-pwd').value='';
  document.getElementById('prof-new-pwd').value='';
  document.getElementById('prof-confirm-pwd').value='';
  ehToast('Password updated successfully.','success');
}
</script>
<script src="assets/js/sidebar.js"></script>
</body>
</html>
